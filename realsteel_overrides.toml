# --- ReXCRT: native SIMD replacements for statically-linked LIBCMT leaves ---
# Identified via tools/360tools/find_crt_funcs.py and confirmed by reading the
# PPC disassembly. Both are textbook leaf routines in the CRT cluster at
# 0x82229xxx. The SDK's Memory group provides native host implementations.
#   memset  0x82229D00: byte-splat rlwimi r4,r4 + 16-byte-unrolled stw loop.
#   memcpy  0x822297D0: dst-align + lbzu/stbu head, word/128-byte block copy.
# memmove not found as a separate function (optional; game appears to use memcpy).
[rexcrt]
memset = 0x82229D00
memcpy = 0x822297D0

# --- Guest frame timing probe at the VdSwap call site ---
# Fires on the guest thread just before the single VdSwap call (bl at
# 0x82250670, in realsteel_recomp.31.cpp). Body in src/realsteel_hooks.cpp.
# The default is uncapped; realsteel_guest_fps_cap can opt into pacing.
[[midasm_hook]]
address = 0x82250670
name = "RealSteelSwapHook"
