# Manual codegen overrides for realsteel
# Merged into the entrypoint config via [entrypoint].includes in realsteel_manifest.toml

# --- Codegen performance options ---
# Emit PPC registers as C++ locals instead of context-struct loads/stores,
# letting Clang keep them in host registers. Verify via the runtime log line
# "Codegen config: ...". skip_lr intentionally left off (riskier; enable last
# and only after a full playtest).
skip_msr = true
ctr_as_local = true
xer_as_local = true
cr_as_local = true
# reserved_as_local = true  # BREAKS BOOT: r13 (TLS/PCR pointer) must live in
# context — enabling this causes "guest access violation: read of 0x00000064"
# at module launch.
reserved_as_local = false
# non_argument/non_volatile as locals BREAK this binary: it uses shared
# savegpr/restgpr stubs that pass r12 and r14-r31 across function boundaries
# through the context. Localizing them causes wandering near-NULL access
# violations at module launch (seen: 0x64, 0x580).
non_argument_as_local = false
non_volatile_as_local = false

# --- Found during initial codegen validation ---

